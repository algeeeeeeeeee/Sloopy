name: Sloopy Native SwiftUI Build

on:
  push:
    branches:
      - main
    paths:
      - 'Native/**'
      - '.github/workflows/native-swiftui-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Native/**'
      - '.github/workflows/native-swiftui-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator and Device
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Generate app icon assets
        run: swift Native/Scripts/GenerateAppIcons.swift Native/Resources/Assets.xcassets

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Native
        run: xcodegen generate --spec project.yml

      - name: List project schemes
        run: xcodebuild -list -project Native/Sloopy.xcodeproj

      - name: Compile for iOS Simulator
        run: |
          xcodebuild \
            -project Native/Sloopy.xcodeproj \
            -scheme Sloopy \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SloopySimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run alternate app icon UI test on iOS Simulator
        run: |
          SIMULATOR_ID="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True
          ))
          for runtime, entries in devices["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found.")
          PY
          )"
          xcodebuild test \
            -project Native/Sloopy.xcodeproj \
            -scheme Sloopy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/SloopyIconUITests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Compile for iPhone Device
        run: |
          xcodebuild \
            -project Native/Sloopy.xcodeproj \
            -scheme Sloopy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SloopyDevice" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify app resources and alternate icons
        run: |
          APP_PATH="$RUNNER_TEMP/SloopyDevice/Build/Products/Release-iphoneos/Sloopy.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons" "$APP_PATH/Info.plist" > "$RUNNER_TEMP/alternate-icons.txt"
          for ICON in CrystalIcon EyeIcon CatIcon CubeIcon; do
            grep -q "$ICON" "$RUNNER_TEMP/alternate-icons.txt"
          done
          echo "Verified Assets.car and all four alternate app icons."

      - name: Package unsigned IPA with TrollStore-compatible executable identity
        run: |
          APP_PATH="$RUNNER_TEMP/SloopyDevice/Build/Products/Release-iphoneos/Sloopy.app"
          test -d "$APP_PATH"

          # TrollStore Lite 2.1.1 signs the main Mach-O by path without passing
          # ldid's -I override. ldid therefore uses the executable filename as
          # the CodeDirectory identifier. Make that identifier equal the real
          # CFBundleIdentifier so LaunchServices sees the caller as its own app.
          BUNDLE_ID="$("/usr/libexec/PlistBuddy" -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          EXECUTABLE_NAME="$("/usr/libexec/PlistBuddy" -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          test "$BUNDLE_ID" = "com.sloopy.daily"
          test "$EXECUTABLE_NAME" = "Sloopy"
          test -f "$APP_PATH/$EXECUTABLE_NAME"
          mv "$APP_PATH/$EXECUTABLE_NAME" "$APP_PATH/$BUNDLE_ID"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $BUNDLE_ID" "$APP_PATH/Info.plist"
          test -f "$APP_PATH/$BUNDLE_ID"
          test "$("/usr/libexec/PlistBuddy" -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")" = "$BUNDLE_ID"
          echo "Prepared executable identity: $BUNDLE_ID"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Sloopy.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ipa/Payload" \
            "$RUNNER_TEMP/Sloopy-unsigned.ipa"

          unzip -p "$RUNNER_TEMP/Sloopy-unsigned.ipa" Payload/Sloopy.app/Info.plist > "$RUNNER_TEMP/packaged-Info.plist"
          test "$( /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/packaged-Info.plist" )" = "$BUNDLE_ID"
          test "$( /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$RUNNER_TEMP/packaged-Info.plist" )" = "$BUNDLE_ID"
          unzip -l "$RUNNER_TEMP/Sloopy-unsigned.ipa" | grep -F "Payload/Sloopy.app/$BUNDLE_ID"
          echo "Verified packaged bundle ID and executable name match."

      - name: Upload iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: Sloopy-unsigned-IPA
          path: ${{ runner.temp }}/Sloopy-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
