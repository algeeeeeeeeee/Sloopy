name: Sloopy Native SwiftUI Build

on:
  push:
    branches:
      - main
    paths:
      - 'Native/**'
      - '.github/workflows/native-swiftui-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Native/**'
      - '.github/workflows/native-swiftui-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Sloopy for iOS
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Generate Crystal primary app icon
        run: swift Native/Scripts/GenerateAppIcons.swift Native/Resources/Assets.xcassets

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Native
        run: xcodegen generate --spec project.yml

      - name: List project schemes
        run: xcodebuild -list -project Native/Sloopy.xcodeproj

      - name: Compile for iOS Simulator
        run: |
          xcodebuild \
            -project Native/Sloopy.xcodeproj \
            -scheme Sloopy \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SloopySimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile for iPhone Device
        run: |
          xcodebuild \
            -project Native/Sloopy.xcodeproj \
            -scheme Sloopy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SloopyDevice" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify Crystal primary icon and app bundle
        run: |
          APP_PATH="$RUNNER_TEMP/SloopyDevice/Build/Products/Release-iphoneos/Sloopy.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          grep -q 'primaryAppIconID = "crystal"' Native/Sources/App/SloopyBuildConfiguration.swift
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" "$APP_PATH/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons" "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo "Unexpected alternate app icon metadata was found."
            exit 1
          fi
          echo "Verified Crystal primary icon and no alternate icon entries."

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/SloopyDevice/Build/Products/Release-iphoneos/Sloopy.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Sloopy.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ipa/Payload" \
            "$RUNNER_TEMP/Sloopy-Crystal-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/Sloopy-Crystal-unsigned.ipa" | grep 'Payload/Sloopy.app/Info.plist'

      - name: Upload Crystal IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sloopy-Crystal-unsigned-IPA
          path: ${{ runner.temp }}/Sloopy-Crystal-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
