name: Sloopy Native SwiftUI Build

on:
  push:
    branches:
      - main
    paths:
      - 'Native/**'
      - '.github/workflows/native-swiftui-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Native/**'
      - '.github/workflows/native-swiftui-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator and Device
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Generate app icon assets
        run: swift Native/Scripts/GenerateAppIcons.swift Native/Resources/Assets.xcassets

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Native
        run: xcodegen generate --spec project.yml

      - name: List project schemes
        run: xcodebuild -list -project Native/Sloopy.xcodeproj

      - name: Compile for iOS Simulator
        run: |
          xcodebuild \
            -project Native/Sloopy.xcodeproj \
            -scheme Sloopy \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SloopySimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile for iPhone Device
        run: |
          xcodebuild \
            -project Native/Sloopy.xcodeproj \
            -scheme Sloopy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SloopyDevice" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # An unsigned build does not embed Sloopy.entitlements into the binary.
      # TrollStore keeps the entitlements that already exist in the binary, so
      # embed them here with ldid (pseudo-signature, not an Apple signature).
      - name: Embed entitlements for TrollStore
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SloopyDevice/Build/Products/Release-iphoneos/Sloopy.app"
          test -f "$APP_PATH/Sloopy"
          brew install ldid
          ldid -SNative/Sloopy-trollstore.entitlements "$APP_PATH/Sloopy"
          echo "Entitlements now embedded in the binary:"
          ldid -e "$APP_PATH/Sloopy" | tee "$RUNNER_TEMP/embedded-entitlements.xml"
          grep -q "com.apple.developer.family-controls" "$RUNNER_TEMP/embedded-entitlements.xml"
          grep -q "application-identifier" "$RUNNER_TEMP/embedded-entitlements.xml"
          grep -q "com.apple.developer.team-identifier" "$RUNNER_TEMP/embedded-entitlements.xml"

      - name: Verify fixed app icon and blank Home Screen label
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SloopyDevice/Build/Products/Release-iphoneos/Sloopy.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as plist_file:
              info = plistlib.load(plist_file)

          actual = info.get("CFBundleDisplayName")
          expected = "\u200B"
          if actual != expected:
              raise SystemExit(
                  f"Expected an invisible Home Screen app label, got {actual!r}"
              )

          icons = info.get("CFBundleIcons", {}).get("CFBundlePrimaryIcon", {})
          if not icons:
              raise SystemExit("The fixed primary app icon is missing.")

          alternates = info.get("CFBundleIcons", {}).get("CFBundleAlternateIcons", {})
          if alternates:
              raise SystemExit(
                  f"Alternate app icons must be disabled, found: {sorted(alternates)}"
              )

          print("Verified fixed primary icon, no alternate icons, and visually blank Home Screen label.")
          PY

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/SloopyDevice/Build/Products/Release-iphoneos/Sloopy.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Sloopy.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ipa/Payload" \
            "$RUNNER_TEMP/Sloopy-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/Sloopy-unsigned.ipa" | grep 'Payload/Sloopy.app/Info.plist'

      - name: Upload iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: Sloopy-unsigned-IPA
          path: ${{ runner.temp }}/Sloopy-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
