name: Deploy Sloopy CCTV Player

on:
  push:
    branches:
      - main
    paths:
      - 'Native/Resources/CCTV/**'
      - '.github/workflows/deploy-cctv-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cctv-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload CCTV player
        uses: actions/upload-pages-artifact@v3
        with:
          path: Native/Resources/CCTV

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
