
name: Sloopy

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Sloopy:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sloopy.daily
        PRODUCT_NAME: Sloopy
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Sloopy!"
